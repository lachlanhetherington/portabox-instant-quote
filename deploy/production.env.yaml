# Production: non-secret runtime settings, applied on every deploy by scripts/deploy.sh.
# Secrets live in Secret Manager; see deploy/production.secrets.
# APP_URL must be the public URL customers use (Twilio signature checks depend on it).
APP_URL: "https://REPLACE-WITH-PRODUCTION-DOMAIN"
# staging | production. Production refuses to fake SMS or payments.
APP_ENV: "production"
FIRESTORE_DATABASE_ID: "(default)"
SETTINGS_ENV: "portabox-prod"
# Dan's live CRM sheet.
SMARTSHEET_QUOTES_SHEET_ID: "3517583962886020"
SMARTSHEET_QUOTES_ONLY: "false"
# Production browser key, restricted to the production domain.
VITE_GOOGLE_MAPS_API_KEY: "REPLACE-WITH-PRODUCTION-MAPS-KEY"
