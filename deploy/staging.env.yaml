# Staging: non-secret runtime settings, applied on every deploy by scripts/deploy.sh.
# Committed on purpose, so every deploy (from any folder) gets the same config.
# Secrets live in Secret Manager; see deploy/staging.secrets.
APP_URL: "https://portabox-staging-623557681504.australia-southeast1.run.app"
# Separate Firestore database, so testing never touches production data or quote numbers.
# staging | production. Production refuses to fake SMS or payments.
APP_ENV: "staging"
FIRESTORE_DATABASE_ID: "staging"
SETTINGS_ENV: "portabox-staging"
# Staging quote numbers start at Q-900001, so they never look like real ones.
QUOTE_NUMBER_START: "900001"
# Finished quotes go to the TEST copy of Dan's sheet; the staff Smartsheet tools are off.
SMARTSHEET_QUOTES_SHEET_ID: "1081187595669380"
SMARTSHEET_QUOTES_ONLY: "true"
# Browser key (visible in every page anyway); restricted by HTTP referrer in Google Cloud.
VITE_GOOGLE_MAPS_API_KEY: "REPLACE-WITH-REFERRER-RESTRICTED-MAPS-BROWSER-KEY"
