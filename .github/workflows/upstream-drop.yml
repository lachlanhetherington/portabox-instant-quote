# Watch the upstream CRM repo, apply what is new, and open a pull request.
#
# This DOES reach the live site. A drop that passes every check is merged to
# main by this job, and Vercel deploys production from main. That is the
# owner's decision, made knowingly; what follows is how the risk is held down.
#
# A drop is merged only when all of these are true: no blocking finding from
# tools/apply-upstream-drop.mjs (which covers a local fix that no longer
# applies, a live credential, an API route that vanished, and a staff surface
# with no gate and no recorded decision), the type-check passes, the build
# passes, and tools/verify-staff-gates.cjs drives a real browser through
# upstream's own staff login for every role and finds each surface still
# shut. Any one of those failing leaves a draft pull request and notifies
# instead, and nothing goes out.
#
# Before any of that, the drop has to stand up as a real deployment. Vercel
# builds a preview for every branch, so the drop's own branch gets deployed
# and tools/smoke-live.cjs is run against it — a build that is green on a
# runner can still be broken once served. No preview, or a preview that fails,
# and the drop is not promoted: production never sees it. The preview URL is
# discovered from what Vercel records against the commit, so there is nothing
# to keep in step by hand.
#
# The shared `staging` branch is deliberately not used for this. Each drop is
# verified on its own branch preview, which gives the same guarantee without
# the robot overwriting a branch that people are using for their own work.
#
# After the merge it runs the same smoke test against production, because the
# production deploy is its own event and can fail on its own. If that fails,
# the run goes red and the rollback is the Revert button on the pull request
# the job just merged — which is why the PR is always created, even for a drop
# merged seconds later.
#
# What is still not covered: a staff surface whose name does not match the
# pattern in find-staff-surfaces.cjs, and anything that is a judgement rather
# than a check — whether a commit message describes what the commit does,
# whether a price change is the one the client asked for. Those are written
# into the report on the PR, which is worth reading after the fact even when
# the drop went out clean.
#
# Runs hourly, which the first step is built around: it reads upstream's head
# with `git ls-remote` and stops there when nothing has changed. A full clone
# of that repo is 64 MB, so cloning every hour to discover nothing would be
# 1.5 GB a day. The same step also stops when the drop it finds has already
# been offered, because otherwise an unresolved drop would rebuild itself and
# send a failure notification every hour until someone dealt with it.
#
# Repo setting this needs: Settings → Actions → General → Workflow
# permissions → "Allow GitHub Actions to create and approve pull requests".
# Without it the job does everything else and fails only at the last step.

name: Upstream CRM drop

on:
  schedule:
    # Hourly, at 20 past. Not on the hour: GitHub queues scheduled runs and
    # the top of the hour is when everyone else's are queued too.
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One at a time. A run that is still building when the next hour comes round
# should not be raced; the queued one will see the same upstream head and
# stop at the first step.
concurrency:
  group: upstream-drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Production. Merging to main deploys here, so this is also what the
      # post-deploy smoke test checks.
      LIVE_URL: https://portabox-instant-quote-dun.vercel.app

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The whole point of this step is to be cheap, because at hourly it is
      # the step that almost always runs alone. No clone, no node, no install.
      - name: Anything new upstream?
        id: peek
        run: |
          REPO=$(jq -r '.repo' .upstream-crm.json)
          UBRANCH=$(jq -r '.branch // "main"' .upstream-crm.json)
          HAD=$(jq -r '.sha' .upstream-crm.json)

          HEADSHA=$(git ls-remote "$REPO" "refs/heads/$UBRANCH" | cut -f1)
          if [ -z "$HEADSHA" ]; then
            echo "Could not read $UBRANCH from $REPO. Upstream may have been" >&2
            echo "renamed, made private, or had its default branch changed." >&2
            exit 1
          fi

          SHORT=$(printf '%s' "$HEADSHA" | cut -c1-7)
          PRBRANCH="upstream-drop/$SHORT"

          {
            echo "repo=$REPO"
            echo "ubranch=$UBRANCH"
            echo "head=$HEADSHA"
            echo "short=$SHORT"
            echo "prbranch=$PRBRANCH"
          } >> "$GITHUB_OUTPUT"

          if [ "$HEADSHA" = "$HAD" ]; then
            echo "new=no" >> "$GITHUB_OUTPUT"
            echo "Up to date with upstream at $SHORT."
            exit 0
          fi

          # Offered before means there is a branch, and possibly someone's
          # work on it. Stop rather than rebuild it and notify again.
          if git ls-remote --exit-code --heads origin "$PRBRANCH" >/dev/null 2>&1; then
            echo "new=offered" >> "$GITHUB_OUTPUT"
            echo "Upstream $SHORT was already offered on $PRBRANCH."
            exit 0
          fi

          echo "new=yes" >> "$GITHUB_OUTPUT"
          echo "Upstream has moved to $SHORT, and it has not been offered yet."

      - name: Nothing to do
        if: steps.peek.outputs.new != 'yes'
        run: |
          if [ "${{ steps.peek.outputs.new }}" = "offered" ]; then
            {
              echo "Upstream \`${{ steps.peek.outputs.short }}\` is already waiting on"
              echo "\`${{ steps.peek.outputs.prbranch }}\`. Left untouched in case it is being"
              echo "worked on — delete that branch to have it rebuilt from scratch."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Up to date with upstream at \`${{ steps.peek.outputs.short }}\`." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything below runs only when a drop actually needs taking, which
      # at hourly is a few times a month.

      - uses: actions/setup-node@v4
        if: steps.peek.outputs.new == 'yes'
        with:
          node-version: '22'

      # Into the runner's temp dir, not the workspace, so upstream's files
      # never look like changes to this repo.
      - name: Clone upstream
        if: steps.peek.outputs.new == 'yes'
        run: |
          git clone --quiet "${{ steps.peek.outputs.repo }}" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" log -1 --oneline \
            "origin/${{ steps.peek.outputs.ubranch }}"

      # Copies upstream in, re-extracts the API routes, re-applies the local
      # fixes, scans for live credentials, diffs the prices and flag defaults,
      # and lists every staff surface with whether it is gated. Writes the
      # report that becomes the PR body. Allowed to fail: a blocking finding
      # should still produce a PR to read.
      - name: Apply the drop
        id: apply
        if: steps.peek.outputs.new == 'yes'
        continue-on-error: true
        run: |
          node tools/apply-upstream-drop.mjs \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/report.md" \
            --status "$RUNNER_TEMP/status.json"

      - name: Read the status
        id: status
        if: steps.peek.outputs.new == 'yes'
        run: |
          S="$RUNNER_TEMP/status.json"
          if [ ! -f "$S" ]; then
            echo 'The apply step produced no status file, so it died before it could' >&2
            echo 'report. Read its log above — this is not a drop finding.' >&2
            exit 1
          fi
          cat "$S"
          {
            echo "status=$(jq -r '.status' "$S")"
            echo "blockers=$(jq -r '.blockers' "$S")"
            # Through jq and trimmed, so a subject containing quotes or
            # backticks cannot break the shell or the later gh invocation.
            echo "subject=$(jq -r '.subject // ""' "$S" | tr -d '\n' | cut -c1-120)"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.peek.outputs.new == 'yes'
        run: npm ci || npm install

      - name: Type-check
        id: tsc
        if: steps.peek.outputs.new == 'yes'
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build
        id: build
        if: steps.peek.outputs.new == 'yes'
        continue-on-error: true
        run: npx vite build

      - name: Install Playwright
        if: steps.peek.outputs.new == 'yes' && steps.build.outcome == 'success'
        run: |
          # Not a dependency of the app — only the gate suite needs it, and
          # pinning it here keeps it out of everyone's install. This is the
          # version the suite was written against.
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Drives a real browser through upstream's own staff login for each
      # role and checks the surface stays shut. The password is generated here
      # and thrown away, so this needs no repository secret.
      - name: Verify the staff gates
        id: gates
        if: steps.peek.outputs.new == 'yes' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          PW=$(node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))')
          NODE_ENV=production ADMIN_PASSWORD="$PW" PORT=3111 npx tsx server.ts \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3111/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:3111/ || {
            echo "the server never came up:"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          ADMIN_PASSWORD="$PW" node tools/verify-staff-gates.cjs \
            | tee "$RUNNER_TEMP/gates.txt"

      - name: Assemble the pull request body
        if: steps.peek.outputs.new == 'yes'
        run: |
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo '## Checks'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| type-check | ${{ steps.tsc.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo "| staff gate suite | ${{ steps.gates.outcome }} |"
            echo
            if [ -f "$RUNNER_TEMP/gates.txt" ]; then
              echo '<details><summary>Gate suite output</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/gates.txt"
              echo '```'
              echo
              echo '</details>'
              echo
            fi
            echo '---'
            echo
            echo 'Opened by `.github/workflows/upstream-drop.yml`, which merges a drop'
            echo 'automatically when every check passes — so if this is already merged,'
            echo 'it is live. If it is a draft, something in the report stopped it and'
            echo 'nothing was deployed.'
            echo
            echo 'To roll back a merged drop, press Revert above. Vercel redeploys from'
            echo '`main`, so the revert is the rollback, and the drop stays on its branch.'
            echo
            echo 'The "for a person to read" section is worth reading either way — the'
            echo 'checks cannot tell whether a commit message is true or whether a price'
            echo 'change is the one that was asked for.'
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      # Recorded before the merge, so the smoke test afterwards can tell a
      # landed deploy from Vercel not having finished yet.
      - name: Note what is live now
        id: before
        if: steps.peek.outputs.new == 'yes'
        run: |
          HASH=$(curl -fsS --max-time 25 "$LIVE_URL/" \
            | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 \
            | sed 's|assets/index-||; s|\.js$||') || HASH=''
          echo "bundle=$HASH" >> "$GITHUB_OUTPUT"
          echo "live bundle before this drop: ${HASH:-unknown}"

      - name: Push the branch and open the PR
        id: push
        if: steps.peek.outputs.new == 'yes'
        # Upstream's commit subject reaches this step. It goes through env,
        # not through ${{ }} inside the script, so a subject containing
        # quotes or backticks is a string here rather than shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ steps.peek.outputs.short }}
          BRANCH: ${{ steps.peek.outputs.prbranch }}
          SUBJECT: ${{ steps.status.outputs.subject }}
          BLOCKERS: ${{ steps.status.outputs.blockers }}
          TSC: ${{ steps.tsc.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GATES: ${{ steps.gates.outcome }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # dist/ and node_modules/ are both in .gitignore, so the build and
          # the no-save playwright install cannot end up on the branch.
          git add -A

          if git diff --cached --quiet; then
            echo 'Upstream moved but nothing changed in this repo.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The peek step already found no such branch. Checked again because
          # between then and now is a few minutes of building, and losing
          # someone's commits to a force-push is not worth the risk.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "\`$BRANCH\` appeared while this ran. Left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -q -m "Upstream CRM drop $SHORT" \
            -m "$SUBJECT" \
            -m "Applied by .github/workflows/upstream-drop.yml. See the pull request for what still needs reading."
          git push -q origin "HEAD:refs/heads/$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Always a draft to begin with. Whether this is fit to merge is not
          # known yet: the drop still has to come up as a real deployment and
          # pass a smoke test against it, which happens in the steps after
          # this one. The merge step marks it ready, or retitles it to say
          # what stopped it.
          gh pr create --base main --head "$BRANCH" \
            --title "Upstream CRM drop $SHORT: $SUBJECT" \
            --body-file "$RUNNER_TEMP/pr-body.md" --draft

          gh pr view "$BRANCH" --json url -q .url >> "$GITHUB_STEP_SUMMARY"

      # Vercel builds a preview for every branch, so the drop is a real
      # deployment before production is touched. The URL is discovered rather
      # than configured: Vercel's GitHub integration records it against the
      # commit, so there is nothing to keep in step by hand.
      - name: Find the drop's preview deployment
        id: preview
        if: steps.peek.outputs.new == 'yes' && steps.push.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          URL=''
          for i in $(seq 1 30); do
            # Current Vercel: a GitHub Deployment carrying environment_url.
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&per_page=20" \
                          --jq '.[].id' 2>/dev/null || true); do
              URL=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=20" \
                      --jq 'map(select(.state == "success")) | .[0].environment_url // empty' \
                      2>/dev/null || true)
              if [ -n "$URL" ]; then break; fi
            done
            if [ -n "$URL" ]; then break; fi

            # Older Vercel: a commit status whose target_url is the preview.
            URL=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=30" \
                    --jq 'map(select(.state == "success") | .target_url)
                          | map(select(. != null and (contains("vercel.app"))))
                          | .[0] // empty' 2>/dev/null || true)
            if [ -n "$URL" ]; then break; fi

            sleep 20
          done

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            echo "preview deployment: $URL"
          else
            echo "No preview deployment URL appeared within about ten minutes."
            echo "Without one the drop cannot be checked on a real deployment, so it"
            echo "will not be promoted to production."
          fi

      - name: Smoke-test the preview, before production sees it
        id: preview_smoke
        if: steps.preview.outputs.url != ''
        continue-on-error: true
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          set +e
          node tools/smoke-live.cjs "$URL" > "$RUNNER_TEMP/preview-smoke.txt" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/preview-smoke.txt"
          {
            echo '## The drop, on its own preview deployment'
            echo
            echo "<$URL>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/preview-smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      # The pull request is still created first, every time, even though a
      # clean drop is merged seconds later. It costs nothing and it is what
      # makes the rollback a button: the PR holds the report, the diff, and
      # GitHub's Revert.
      - name: Merge it when every check passed
        id: merge
        if: steps.peek.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.peek.outputs.prbranch }}
          SHORT: ${{ steps.peek.outputs.short }}
          SUBJECT: ${{ steps.status.outputs.subject }}
          BLOCKERS: ${{ steps.status.outputs.blockers }}
          TSC: ${{ steps.tsc.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GATES: ${{ steps.gates.outcome }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_SMOKE: ${{ steps.preview_smoke.outcome }}
        run: |
          NEEDS=0
          if [ "$BLOCKERS" != "0" ]; then NEEDS=1; fi
          if [ "$TSC" != "success" ]; then NEEDS=1; fi
          if [ "$BUILD" != "success" ]; then NEEDS=1; fi
          if [ "$GATES" != "success" ]; then NEEDS=1; fi

          # The drop has to have stood up as a real deployment. No preview
          # URL means it was never checked anywhere but a runner, which is
          # not enough to go to production unattended.
          if [ -z "$PREVIEW_URL" ]; then
            NEEDS=1
            echo "No preview deployment was found, so nothing has been verified"
            echo "outside CI."
          elif [ "$PREVIEW_SMOKE" != "success" ]; then
            NEEDS=1
            echo "The preview deployment did not pass its smoke test."
          fi

          if [ "$NEEDS" != "0" ]; then
            echo "merged=no" >> "$GITHUB_OUTPUT"
            echo "Not merging: something needs a person. The draft pull request stands."
            gh pr edit "$BRANCH" \
              --title "[needs review] Upstream CRM drop $SHORT: $SUBJECT" || true
            exit 0
          fi

          # Clean, and verified on its own deployment. Out of draft so it can
          # be merged.
          gh pr ready "$BRANCH"

          # Merged, but the branch is deliberately kept. It is the record of
          # which drops have been offered, and that record has to survive a
          # revert.
          #
          # Pressing Revert on the merged pull request undoes the squashed
          # commit — which contains the .upstream-crm.json update as well as
          # upstream's files. So after a revert the marker points at the
          # previous revision again, and the next hourly run would see this
          # drop as new. With the branch deleted it would rebuild it and merge
          # it straight back, re-deploying the thing that was just reverted,
          # once an hour. With the branch kept, the peek step sees it has been
          # offered and stops.
          #
          # To deliberately re-offer a drop, delete its branch.
          #
          # Mergeability is computed asynchronously after the PR is opened,
          # so the first attempt can lose a race with GitHub.
          for i in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash; then
              echo "merged=yes" >> "$GITHUB_OUTPUT"
              echo "Merged to main. Vercel deploys from there."
              exit 0
            fi
            echo "merge attempt $i did not take; waiting"
            sleep 15
          done

          echo "merged=no" >> "$GITHUB_OUTPUT"
          echo "The checks all passed but the merge would not go through." >&2
          echo "Branch protection, or the repo setting that lets Actions open and" >&2
          echo "merge pull requests, is the usual reason. The pull request is open" >&2
          echo "and complete, so it can be merged by hand." >&2
          exit 1

      # Between CI passing and production working there is a deploy, and
      # nobody is watching it. A build that is green on a runner can still be
      # broken live.
      - name: Wait for Vercel, then smoke-test production
        id: smoke
        if: steps.merge.outputs.merged == 'yes'
        continue-on-error: true
        env:
          BEFORE: ${{ steps.before.outputs.bundle }}
        run: |
          echo "waiting for Vercel to publish a new bundle (was ${BEFORE:-unknown})"
          LANDED=no
          for i in $(seq 1 20); do
            NOW=$(curl -fsS --max-time 20 "$LIVE_URL/" \
              | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 \
              | sed 's|assets/index-||; s|\.js$||') || NOW=''
            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "deploy landed after ~$(( i * 20 ))s: $BEFORE -> $NOW"
              LANDED=yes
              break
            fi
            sleep 20
          done
          if [ "$LANDED" != "yes" ]; then
            echo "No new bundle within about seven minutes. Smoke-testing anyway so"
            echo "the summary says what production is actually serving."
          fi

          # With the old hash, so a deploy that never landed is a failure
          # rather than a pass against the previous build.
          #
          # Run first, printed second, and the exit status kept. Piping
          # straight into tee would hand this step tee's status instead —
          # always zero — so a failing smoke test would read as a pass.
          set +e
          if [ -n "$BEFORE" ]; then
            node tools/smoke-live.cjs "$LIVE_URL" --expect-bundle-change "$BEFORE" \
              > "$RUNNER_TEMP/smoke.txt" 2>&1
          else
            node tools/smoke-live.cjs "$LIVE_URL" > "$RUNNER_TEMP/smoke.txt" 2>&1
          fi
          RC=$?
          set -e

          cat "$RUNNER_TEMP/smoke.txt"
          {
            echo '## Production after the merge'
            echo
            echo '```'
            cat "$RUNNER_TEMP/smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      # Deliberately ends the run in failure when a person is needed.
      #
      # Not because the job broke — it is how the notification happens.
      # GitHub does not email anyone about a successful scheduled run, so a
      # held-back drop, or a deploy that went out and broke something, would
      # sit unseen for as long as nobody happened to look. GitHub does email
      # about a failed scheduled run, to whoever last changed the cron line,
      # and that is the only push notification available here without adding
      # a service and a secret.
      #
      # It fires once per drop, not once an hour: the peek step stops before
      # any of this for a drop that already has a branch.
      #
      # Green run: it went live and production checks out. Red run: read it.
      - name: Say if this needs a person
        if: steps.peek.outputs.new == 'yes'
        env:
          SHORT: ${{ steps.peek.outputs.short }}
          MERGED: ${{ steps.merge.outputs.merged }}
          SMOKE: ${{ steps.smoke.outcome }}
          BLOCKERS: ${{ steps.status.outputs.blockers }}
          TSC: ${{ steps.tsc.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GATES: ${{ steps.gates.outcome }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_SMOKE: ${{ steps.preview_smoke.outcome }}
        run: |
          # if-blocks rather than `[ test ] && VAR=1`. Not because the && form
          # aborts mid-script — under bash -e it does not, the failing test is
          # exempt as a non-final command of an && list — but because such a
          # line becomes the step's exit status if it ever ends up last, and a
          # false test then fails the step silently. The explicit form cannot
          # acquire that behaviour by being moved.

          if [ "$MERGED" = "yes" ] && [ "$SMOKE" = "success" ]; then
            echo "Drop $SHORT is live, and production is serving the quote flow with"
            echo "the staff gate in place. Nothing needed you."
            exit 0
          fi

          if [ "$MERGED" = "yes" ]; then
            echo "Drop $SHORT WENT LIVE and the production smoke test did not pass."
            echo
            echo "Production is in that state now. The smoke output above says which"
            echo "check failed. To roll back, open the merged pull request and press"
            echo "Revert — Vercel redeploys from main, so the revert is the rollback."
            exit 1
          fi

          echo "Drop $SHORT was NOT merged, and is waiting as a draft pull request:"
          echo "  blocking findings: $BLOCKERS"
          echo "  type-check: $TSC   build: $BUILD   gate suite: $GATES"
          if [ -z "$PREVIEW_URL" ]; then
            echo "  preview deployment: none found, so nothing was verified outside CI"
          else
            echo "  preview deployment: $PREVIEW_SMOKE  ($PREVIEW_URL)"
          fi
          echo
          echo "Nothing reached the live site. Read the pull request — its report says"
          echo "what stopped it, and the preview URL above is the drop running, so you"
          echo "can click through it without deploying anything."
          exit 1
