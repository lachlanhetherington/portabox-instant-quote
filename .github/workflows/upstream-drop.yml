# Watch the upstream CRM repo, put what is new on `staging`, and promote it
# to `main` once the staging deployment checks out.
#
#   upstream commit  ->  staging  ->  staging deployment is tested  ->  main
#
# main is production: Vercel deploys it the moment anything lands there. So
# nothing reaches customers until a drop has been built, checked, deployed to
# staging, and tested on that real deployment.
#
# A drop is promoted only when all of these hold: no blocking finding from
# tools/apply-upstream-drop.mjs (a local fix that no longer applies, a live
# credential, an API route that vanished, a staff surface with no gate and no
# recorded decision), the type-check passes, the build passes,
# tools/verify-staff-gates.cjs drives a real browser through upstream's own
# staff login for every role and finds each surface still shut, and
# tools/smoke-live.cjs passes against the deployed staging site. Any one of
# those failing leaves the drop sitting on staging with an open pull request,
# and production is untouched.
#
# Because staging is a shared branch, the job will not start while staging has
# anything on it that main does not. A held drop, or somebody's unfinished
# work, has to be dealt with first — otherwise promoting a drop would carry
# that work into production with it. That check is also what stops a failed
# drop being rebuilt and re-notified every hour.
#
# The promotion is a real merge commit, deliberately, so that staging stays an
# ancestor of main and the next run sees a clean staging. A squash merge would
# leave staging permanently "ahead" of main and block every future drop.
#
# Runs hourly. The first step reads upstream's head with `git ls-remote` and
# stops there when nothing has changed: a full clone of that repo is 64 MB, so
# cloning every hour to learn nothing would be 1.5 GB a day.
#
# Two things outside this file have to be set up.
#
# Settings → Actions → General → Workflow permissions → "Allow GitHub Actions
# to create and approve pull requests". Without it the job builds and checks a
# drop but cannot open or merge the pull request.
#
# Preview deployments are protected by default, and a protected deployment
# answers automation with a Vercel login page — so the staging check cannot
# pass and nothing is promoted. That is the safe way round, not a bug: the
# drop waits on staging, and a signed-in browser opens the staging URL
# perfectly well. To let the robot in, either turn Vercel Authentication off
# for Preview in Project Settings → Deployment Protection, or create a
# Protection Bypass for Automation token there and add it as the repository
# secret VERCEL_PROTECTION_BYPASS.

name: Upstream CRM drop

on:
  schedule:
    # Hourly, at 20 past. Not on the hour: GitHub queues scheduled runs and
    # the top of the hour is when everyone else's are queued too.
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-drop
  cancel-in-progress: false

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Production, which main deploys to.
      LIVE_URL: https://portabox-instant-quote-dun.vercel.app

      # Vercel's stable per-branch alias is
      #   <project>-git-<branch>-<scope>.vercel.app
      # Taken from these rather than discovered, because what Vercel records
      # against a commit is a link to its own dashboard, not to the deployed
      # site. If the project or team is renamed, these change with it, and
      # until they do nothing is promoted — the staging check cannot pass
      # against a host that does not resolve, which is the right failure.
      VERCEL_PROJECT: portabox-instant-quote
      VERCEL_SCOPE: lhm-edia

      STAGING_BRANCH: staging

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheap on purpose: at hourly this is the step that almost always runs
      # alone. No clone, no node, no install.
      - name: Anything new upstream?
        id: peek
        run: |
          REPO=$(jq -r '.repo' .upstream-crm.json)
          UBRANCH=$(jq -r '.branch // "main"' .upstream-crm.json)
          HAD=$(jq -r '.sha' .upstream-crm.json)

          HEADSHA=$(git ls-remote "$REPO" "refs/heads/$UBRANCH" | cut -f1)
          if [ -z "$HEADSHA" ]; then
            echo "Could not read $UBRANCH from $REPO. Upstream may have been" >&2
            echo "renamed, made private, or had its default branch changed." >&2
            exit 1
          fi

          SHORT=$(printf '%s' "$HEADSHA" | cut -c1-7)
          {
            echo "repo=$REPO"
            echo "ubranch=$UBRANCH"
            echo "head=$HEADSHA"
            echo "short=$SHORT"
          } >> "$GITHUB_OUTPUT"

          if [ "$HEADSHA" = "$HAD" ]; then
            echo "new=no" >> "$GITHUB_OUTPUT"
            echo "Up to date with upstream at $SHORT."
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
            echo "Upstream has moved to $SHORT."
          fi

      # staging is shared. If anything is on it that main does not have — a
      # drop that stalled, or someone's own work — a drop must not be stacked
      # on top, because promoting it would take that work to production too.
      - name: Is staging clear?
        id: staging
        if: steps.peek.outputs.new == 'yes'
        run: |
          git fetch origin --quiet "+refs/heads/*:refs/remotes/origin/*"
          AHEAD=$(git rev-list --count "origin/main..origin/$STAGING_BRANCH")
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" = "0" ]; then
            echo "clear=yes" >> "$GITHUB_OUTPUT"
            echo "staging holds nothing that main does not. Safe to put a drop on it."
          else
            echo "clear=no" >> "$GITHUB_OUTPUT"
            echo "staging has $AHEAD commit(s) that main does not:"
            git log --oneline "origin/main..origin/$STAGING_BRANCH"
          fi

      - name: Nothing to do
        if: steps.peek.outputs.new != 'yes' || steps.staging.outputs.clear == 'no'
        run: |
          if [ "${{ steps.peek.outputs.new }}" != "yes" ]; then
            echo "Up to date with upstream at \`${{ steps.peek.outputs.short }}\`." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Upstream has \`${{ steps.peek.outputs.short }}\` waiting, but **staging is not clear**:"
              echo "it holds ${{ steps.staging.outputs.ahead }} commit(s) that \`main\` does not."
              echo
              echo 'Nothing has been done. Either merge staging into main, or reset it'
              echo 'with `git push origin main:staging --force`, and the next run will'
              echo 'pick the drop up.'
              echo
              echo 'This run is green on purpose — a drop that stalled here was already'
              echo 'reported once, and repeating that every hour would be noise.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything below runs only when there is a drop to take and somewhere
      # clear to put it.

      - uses: actions/setup-node@v4
        if: steps.staging.outputs.clear == 'yes'
        with:
          node-version: '22'

      - name: Clone upstream
        if: steps.staging.outputs.clear == 'yes'
        run: |
          git clone --quiet "${{ steps.peek.outputs.repo }}" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" log -1 --oneline \
            "origin/${{ steps.peek.outputs.ubranch }}"

      # Copies upstream in, re-extracts the API routes, re-applies the local
      # fixes, scans for live credentials, diffs the prices and flag defaults,
      # and lists every staff surface with whether it is gated. Writes the
      # report that becomes the pull request body. Allowed to fail: a blocking
      # finding should still produce something to read.
      - name: Apply the drop
        id: apply
        if: steps.staging.outputs.clear == 'yes'
        continue-on-error: true
        run: |
          node tools/apply-upstream-drop.mjs \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/report.md" \
            --status "$RUNNER_TEMP/status.json"

      - name: Read the status
        id: status
        if: steps.staging.outputs.clear == 'yes'
        run: |
          S="$RUNNER_TEMP/status.json"
          if [ ! -f "$S" ]; then
            echo 'The apply step produced no status file, so it died before it could' >&2
            echo 'report. Read its log above — this is not a drop finding.' >&2
            exit 1
          fi
          cat "$S"
          {
            echo "status=$(jq -r '.status' "$S")"
            echo "blockers=$(jq -r '.blockers' "$S")"
            # Through jq and trimmed, so a subject containing quotes or
            # backticks cannot break the shell or the later gh invocation.
            echo "subject=$(jq -r '.subject // ""' "$S" | tr -d '\n' | cut -c1-120)"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.staging.outputs.clear == 'yes'
        run: npm ci || npm install

      - name: Type-check
        id: tsc
        if: steps.staging.outputs.clear == 'yes'
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build
        id: build
        if: steps.staging.outputs.clear == 'yes'
        continue-on-error: true
        run: npx vite build

      - name: Install Playwright
        if: steps.staging.outputs.clear == 'yes' && steps.build.outcome == 'success'
        run: |
          # Not a dependency of the app — only the gate suite needs it, and
          # pinning it here keeps it out of everyone's install.
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Drives a real browser through upstream's own staff login for each role
      # and checks the surface stays shut. The password is generated here and
      # thrown away, so this needs no repository secret.
      - name: Verify the staff gates
        id: gates
        if: steps.staging.outputs.clear == 'yes' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          PW=$(node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))')
          NODE_ENV=production ADMIN_PASSWORD="$PW" PORT=3111 npx tsx server.ts \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3111/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:3111/ || {
            echo "the server never came up:"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          ADMIN_PASSWORD="$PW" node tools/verify-staff-gates.cjs \
            | tee "$RUNNER_TEMP/gates.txt"

      - name: Assemble the pull request body
        if: steps.staging.outputs.clear == 'yes'
        run: |
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo '## Checks'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| type-check | ${{ steps.tsc.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo "| staff gate suite | ${{ steps.gates.outcome }} |"
            echo
            if [ -f "$RUNNER_TEMP/gates.txt" ]; then
              echo '<details><summary>Gate suite output</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/gates.txt"
              echo '```'
              echo
              echo '</details>'
              echo
            fi
            echo '---'
            echo
            echo 'Opened by `.github/workflows/upstream-drop.yml`. The drop is on'
            echo '`staging` and deployed there. If every check passed, including a smoke'
            echo 'test against the staging deployment, this is merged automatically and'
            echo 'is already live. If it is still open, something stopped it — the report'
            echo 'above says what, and production has not been touched.'
            echo
            echo 'To undo a merged drop, press Revert. Vercel redeploys from `main`, so'
            echo 'the revert is the rollback.'
            echo
            echo 'The "for a person to read" section is worth reading either way: the'
            echo 'checks cannot tell whether a commit message is true, or whether a price'
            echo 'change is the one that was asked for.'
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      # Recorded before anything is promoted, so the production smoke test can
      # tell a landed deploy from Vercel not having finished.
      - name: Note what is live now
        id: before
        if: steps.staging.outputs.clear == 'yes'
        run: |
          HASH=$(curl -fsS --max-time 25 "$LIVE_URL/" \
            | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 \
            | sed 's|assets/index-||; s|\.js$||') || HASH=''
          echo "bundle=$HASH" >> "$GITHUB_OUTPUT"
          echo "live bundle before this drop: ${HASH:-unknown}"

      - name: Put the drop on staging, and open the promotion PR
        id: push
        if: steps.staging.outputs.clear == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ steps.peek.outputs.short }}
          SUBJECT: ${{ steps.status.outputs.subject }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # dist/ and node_modules/ are in .gitignore, so the build and the
          # no-save playwright install cannot end up on the branch.
          git add -A
          if git diff --cached --quiet; then
            echo 'Upstream moved but nothing changed in this repo.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -q -m "Upstream CRM drop $SHORT" \
            -m "$SUBJECT" \
            -m "Applied by .github/workflows/upstream-drop.yml. See the pull request for what still needs reading."

          # A fast-forward: this is main plus one commit, and staging was
          # checked to hold nothing main does not.
          git push -q origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "pushed=yes" >> "$GITHUB_OUTPUT"

          # One promotion PR at a time, staging into main. If one is already
          # open, refresh its body rather than failing.
          gh pr create --base main --head "$STAGING_BRANCH" \
            --title "Upstream CRM drop $SHORT: $SUBJECT" \
            --body-file "$RUNNER_TEMP/pr-body.md" --draft \
          || gh pr edit "$STAGING_BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"

          gh pr view "$STAGING_BRANCH" --json url -q .url >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the staging deployment
        id: staging_deploy
        if: steps.push.outputs.pushed == 'yes'
        run: |
          URL="https://$VERCEL_PROJECT-git-$STAGING_BRANCH-$VERCEL_SCOPE.vercel.app"
          echo "expecting $URL"
          FOUND=''
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/" || echo 000)
            # 404 is Vercel saying there is no such deployment yet, 000 is no
            # answer. Anything else means it exists — including 401 and 302,
            # which are Deployment Protection, and which the smoke test
            # reports properly.
            if [ "$CODE" != "404" ] && [ "$CODE" != "000" ]; then
              echo "staging answering with $CODE after about $(( i * 20 ))s"
              FOUND="$URL"
              break
            fi
            sleep 20
          done
          echo "url=$FOUND" >> "$GITHUB_OUTPUT"
          if [ -z "$FOUND" ]; then
            echo "No staging deployment at $URL within about ten minutes, so the drop"
            echo "has only been seen on a runner. It will not be promoted."
          fi

      - name: Smoke-test staging, before main sees it
        id: staging_smoke
        if: steps.staging_deploy.outputs.url != ''
        continue-on-error: true
        env:
          URL: ${{ steps.staging_deploy.outputs.url }}
          # Optional. Preview deployments are protected by default, and a
          # protected deployment cannot be tested from here — see the notes at
          # the top of this file. Without it the drop stays on staging rather
          # than being promoted, which is the safe way round.
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set +e
          node tools/smoke-live.cjs "$URL" > "$RUNNER_TEMP/staging-smoke.txt" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/staging-smoke.txt"
          {
            echo '## Staging'
            echo
            echo "<$URL>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/staging-smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Promote staging to main
        id: merge
        if: steps.push.outputs.pushed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ steps.peek.outputs.short }}
          SUBJECT: ${{ steps.status.outputs.subject }}
          BLOCKERS: ${{ steps.status.outputs.blockers }}
          TSC: ${{ steps.tsc.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GATES: ${{ steps.gates.outcome }}
          STAGING_URL: ${{ steps.staging_deploy.outputs.url }}
          STAGING_SMOKE: ${{ steps.staging_smoke.outcome }}
        run: |
          NEEDS=0
          if [ "$BLOCKERS" != "0" ]; then NEEDS=1; fi
          if [ "$TSC" != "success" ]; then NEEDS=1; fi
          if [ "$BUILD" != "success" ]; then NEEDS=1; fi
          if [ "$GATES" != "success" ]; then NEEDS=1; fi
          if [ -z "$STAGING_URL" ]; then
            NEEDS=1
            echo "No staging deployment, so nothing was verified outside CI."
          elif [ "$STAGING_SMOKE" != "success" ]; then
            NEEDS=1
            echo "The staging deployment did not pass its smoke test."
          fi

          if [ "$NEEDS" != "0" ]; then
            echo "merged=no" >> "$GITHUB_OUTPUT"
            echo "Not promoting. The drop stays on staging and production is untouched."
            gh pr edit "$STAGING_BRANCH" \
              --title "[needs review] Upstream CRM drop $SHORT: $SUBJECT" || true
            exit 0
          fi

          gh pr ready "$STAGING_BRANCH"

          # A merge commit, not a squash. Squashing would rewrite the drop as
          # a new commit on main, leaving staging permanently ahead of main
          # and blocking every future drop at the "is staging clear?" step.
          # Mergeability is computed asynchronously, so the first attempt can
          # lose a race with GitHub.
          for i in 1 2 3 4 5; do
            if gh pr merge "$STAGING_BRANCH" --merge; then
              echo "merged=yes" >> "$GITHUB_OUTPUT"
              echo "Promoted to main. Vercel deploys production from there."
              exit 0
            fi
            echo "merge attempt $i did not take; waiting"
            sleep 15
          done

          echo "merged=no" >> "$GITHUB_OUTPUT"
          echo "Everything passed but the merge would not go through." >&2
          echo "Branch protection, or the repo setting that lets Actions open and" >&2
          echo "merge pull requests, is the usual reason. The pull request is open" >&2
          echo "and complete, so it can be merged by hand." >&2
          exit 1

      - name: Wait for production, then smoke-test it
        id: smoke
        if: steps.merge.outputs.merged == 'yes'
        continue-on-error: true
        env:
          BEFORE: ${{ steps.before.outputs.bundle }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          echo "waiting for Vercel to publish a new bundle (was ${BEFORE:-unknown})"
          LANDED=no
          for i in $(seq 1 20); do
            NOW=$(curl -fsS --max-time 20 "$LIVE_URL/" \
              | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 \
              | sed 's|assets/index-||; s|\.js$||') || NOW=''
            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "deploy landed after ~$(( i * 20 ))s: $BEFORE -> $NOW"
              LANDED=yes
              break
            fi
            sleep 20
          done
          if [ "$LANDED" != "yes" ]; then
            echo "No new bundle within about seven minutes. Smoke-testing anyway so"
            echo "the summary says what production is actually serving."
          fi

          # Run first, print second, keep the exit status. Piping into tee
          # would hand this step tee's status instead — always zero — so a
          # failing smoke test would read as a pass.
          set +e
          if [ -n "$BEFORE" ]; then
            node tools/smoke-live.cjs "$LIVE_URL" --expect-bundle-change "$BEFORE" \
              > "$RUNNER_TEMP/smoke.txt" 2>&1
          else
            node tools/smoke-live.cjs "$LIVE_URL" > "$RUNNER_TEMP/smoke.txt" 2>&1
          fi
          RC=$?
          set -e

          cat "$RUNNER_TEMP/smoke.txt"
          {
            echo '## Production after the promotion'
            echo
            echo '```'
            cat "$RUNNER_TEMP/smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      # Deliberately ends the run in failure when a person is needed. Not
      # because the job broke — it is how the notification happens. GitHub
      # does not email about a successful scheduled run, so a drop waiting on
      # staging, or a promotion that broke production, would sit unseen.
      # GitHub does email about a failed scheduled run, to whoever last
      # changed the cron line.
      #
      # It fires once per drop, not once an hour: while a drop is stuck on
      # staging, the "is staging clear?" step ends the run quietly.
      #
      # Green: it went live and production checks out, or there was nothing to
      # do. Red: read it.
      - name: Say if this needs a person
        if: steps.push.outputs.pushed == 'yes'
        env:
          SHORT: ${{ steps.peek.outputs.short }}
          MERGED: ${{ steps.merge.outputs.merged }}
          SMOKE: ${{ steps.smoke.outcome }}
          BLOCKERS: ${{ steps.status.outputs.blockers }}
          TSC: ${{ steps.tsc.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GATES: ${{ steps.gates.outcome }}
          STAGING_URL: ${{ steps.staging_deploy.outputs.url }}
          STAGING_SMOKE: ${{ steps.staging_smoke.outcome }}
        run: |
          # if-blocks rather than `[ test ] && VAR=1`. Not because the && form
          # aborts mid-script — under bash -e it does not, the failing test is
          # exempt as a non-final command of an && list — but because such a
          # line becomes the step's exit status if it ever ends up last, and a
          # false test then fails the step silently.

          if [ "$MERGED" = "yes" ] && [ "$SMOKE" = "success" ]; then
            echo "Drop $SHORT went to staging, checked out there, and is now live."
            echo "Production is serving the quote flow with the staff gate in place."
            exit 0
          fi

          if [ "$MERGED" = "yes" ]; then
            echo "Drop $SHORT WENT LIVE and the production smoke test did not pass."
            echo
            echo "It passed on staging, so this is the production deploy itself. The"
            echo "smoke output above says which check failed. To roll back, open the"
            echo "merged pull request and press Revert."
            exit 1
          fi

          echo "Drop $SHORT is ON STAGING and was NOT promoted:"
          echo "  blocking findings: $BLOCKERS"
          echo "  type-check: $TSC   build: $BUILD   gate suite: $GATES"
          if [ -z "$STAGING_URL" ]; then
            echo "  staging deployment: none found"
          else
            echo "  staging smoke test: $STAGING_SMOKE"
            echo "  staging URL: $STAGING_URL"
          fi
          echo
          echo "Production is untouched. Open the staging URL above to see the drop"
          echo "running, and the pull request for what stopped it."
          echo
          echo "Until staging is dealt with — merged, or reset with"
          echo "'git push origin main:staging --force' — no further drop will be taken."
          exit 1
