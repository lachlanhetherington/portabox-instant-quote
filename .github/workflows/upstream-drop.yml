# Watch the upstream CRM repo, put what is new on `staging`, and promote it
# to `main` once the staging deployment checks out AND a person approves.
#
#   upstream commit
#     -> staging
#     -> staging deployment is built and smoke-tested
#     -> YOU APPROVE
#     -> main  ->  production
#
# The approval is a GitHub Environment protection rule, not anything built
# here. The `promote` job declares `environment: production`, so GitHub holds
# the run before that job starts and asks the environment's reviewers to
# approve or reject — by email, and as a push notification in the GitHub
# mobile app. Approve and the merge happens; reject and the run stops with
# production untouched.
#
# SETUP, once, or the gate does not exist:
#   Settings -> Environments -> New environment -> name it exactly
#   `production` -> tick "Required reviewers" -> add yourself -> Save.
# Without it the job still runs, just without pausing, and the drop would go
# live unreviewed. Required reviewers are free on public repositories.
#
# Nothing reaches customers until a drop has been built, checked, deployed to
# staging, tested on that real deployment, and then approved.
#
# A drop is only ever offered for approval when all of these hold: no blocking
# finding from tools/apply-upstream-drop.mjs (a local fix that no longer
# applies, a live credential, an API route that vanished, a staff surface with
# no gate and no recorded decision), the type-check passes, the build passes,
# tools/verify-staff-gates.cjs drives a real browser through upstream's own
# staff login for every role and finds each surface still shut, and
# tools/smoke-live.cjs passes against the deployed staging site. Any one of
# those failing leaves the drop on staging with the pull request open, and no
# approval is requested — there is nothing worth approving.
#
# Because staging is shared, the job will not start while staging holds
# anything main does not. A drop awaiting approval, one that stalled, or
# somebody's own work has to be dealt with first; otherwise promoting would
# carry that work into production too. That check is also what stops a waiting
# drop being rebuilt and re-notified every hour.
#
# The promotion is a merge commit, deliberately, so staging stays an ancestor
# of main and the next run sees a clean staging. A squash merge would leave
# staging permanently ahead of main and block every future drop.
#
# Runs hourly. The first step reads upstream's head with `git ls-remote` and
# stops there when nothing has changed: a full clone of that repo is 64 MB, so
# cloning hourly to learn nothing would be 1.5 GB a day.
#
# UPSTREAM_TOKEN, and why it is not optional:
#
# ahammo67/portabox-CRM is private and owned by someone else. A workflow's
# own GITHUB_TOKEN only grants access to the repository it runs in, so
# without a token of its own this job gets "Repository not found" and cannot
# see upstream at all. Confirmed by the first run of this workflow.
#
# Add a repository secret named UPSTREAM_TOKEN containing a token that can
# read that repo. In order of preference:
#
#   1. A read-only deploy key or a fine-grained token created by ahammo67,
#      scoped to that one repository with Contents: Read. Narrowest, but
#      needs the repo's owner to make it — a fine-grained token can only
#      reach repositories owned by whoever created it, so one made from this
#      side cannot cover theirs.
#   2. A classic personal access token with the `repo` scope, from an account
#      that is already a collaborator there. Works immediately, but `repo` is
#      broad: it can read every private repository that account can see, and
#      it would be sitting in this repo's secrets. Prefer a token on an
#      account with little else on it, and give it an expiry.
#
# Also needed: Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests", or the pull
# request cannot be opened or merged.
#
# Preview deployments are protected by default, and a protected deployment
# answers automation with a Vercel login page, so the staging smoke test
# cannot pass and no approval is ever requested. That is the safe way round:
# the drop waits on staging and a signed-in browser opens the staging URL
# fine. To let the robot in, either turn Vercel Authentication off for Preview
# in Project Settings -> Deployment Protection, or create a Protection Bypass
# for Automation token there and add it as the secret
# VERCEL_PROTECTION_BYPASS.

name: Upstream CRM drop

on:
  schedule:
    # Hourly, at 20 past. Not on the hour: GitHub queues scheduled runs and
    # the top of the hour is when everyone else's are queued too.
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-drop
  cancel-in-progress: false

env:
  # Production, which main deploys to.
  LIVE_URL: https://portabox-instant-quote-dun.vercel.app

  # Vercel's stable per-branch alias is
  #   <project>-git-<branch>-<scope>.vercel.app
  # Taken from these rather than discovered, because what Vercel records
  # against a commit is a link to its own dashboard, not to the deployed site.
  # If the project or team is renamed these change with it, and until they do
  # nothing is promoted — the staging check cannot pass against a host that
  # does not resolve, which is the right failure.
  VERCEL_PROJECT: portabox-instant-quote
  VERCEL_SCOPE: lhm-edia

  STAGING_BRANCH: staging

jobs:
  # ---------------------------------------------------------------- stage --
  # Everything up to "the drop is on staging, deployed, and checks out".
  # Deliberately does not touch main.
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      promotable: ${{ steps.verdict.outputs.promotable }}
      short: ${{ steps.peek.outputs.short }}
      subject: ${{ steps.status.outputs.subject }}
      before: ${{ steps.before.outputs.bundle }}
      staging_url: ${{ steps.staging_deploy.outputs.url }}

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cheap on purpose: at hourly this is the step that almost always runs
      # alone. No clone, no node, no install.
      - name: Anything new upstream?
        id: peek
        env:
          # Upstream is a PRIVATE repo belonging to someone else, so the
          # job's own GITHUB_TOKEN cannot read it — that token only ever
          # grants access to this repository. Without this secret the step
          # below gets "Repository not found" and the whole pipeline is
          # blind. See the note at the top of this file for what to create.
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          REPO=$(jq -r '.repo' .upstream-crm.json)
          UBRANCH=$(jq -r '.branch // "main"' .upstream-crm.json)
          HAD=$(jq -r '.sha' .upstream-crm.json)

          # Built by stripping the scheme and host and putting them back with
          # the credential — no regex, so nothing in the token can be read as
          # a delimiter. Deliberately NOT written to GITHUB_OUTPUT: a step
          # output is not a secret, and the clone step can build the same
          # thing from the secret itself. Never echoed; errors print $REPO,
          # which carries no credential.
          if [ -n "$UPSTREAM_TOKEN" ]; then
            AUTH_REPO="https://x-access-token:$UPSTREAM_TOKEN@github.com/${REPO#https://github.com/}"
          else
            AUTH_REPO="$REPO"
          fi

          HEADSHA=$(git ls-remote "$AUTH_REPO" "refs/heads/$UBRANCH" 2>/dev/null | cut -f1)
          if [ -z "$HEADSHA" ]; then
            echo "Could not read $UBRANCH from $REPO." >&2
            echo >&2
            if [ -z "$UPSTREAM_TOKEN" ]; then
              echo "No UPSTREAM_TOKEN secret is set, and that repository is private," >&2
              echo "so this job cannot see it at all. A workflow's own GITHUB_TOKEN" >&2
              echo "only grants access to the repository it runs in. Add a secret" >&2
              echo "named UPSTREAM_TOKEN holding a token that can read it — the note" >&2
              echo "at the top of this workflow says which kind." >&2
            else
              echo "UPSTREAM_TOKEN is set but did not work. It may have expired, been" >&2
              echo "revoked, or not cover this repository. Upstream may also have been" >&2
              echo "renamed or had its default branch changed." >&2
            fi
            exit 1
          fi

          SHORT=$(printf '%s' "$HEADSHA" | cut -c1-7)
          {
            echo "repo=$REPO"
            echo "ubranch=$UBRANCH"
            echo "short=$SHORT"
          } >> "$GITHUB_OUTPUT"

          if [ "$HEADSHA" = "$HAD" ]; then
            echo "new=no" >> "$GITHUB_OUTPUT"
            echo "Up to date with upstream at $SHORT."
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
            echo "Upstream has moved to $SHORT."
          fi

      # staging is shared. If anything is on it that main does not have — a
      # drop awaiting approval, one that stalled, or someone's own work — a
      # drop must not be stacked on top, because promoting it would take that
      # work to production too.
      - name: Is staging clear?
        id: staging
        if: steps.peek.outputs.new == 'yes'
        run: |
          git fetch origin --quiet "+refs/heads/*:refs/remotes/origin/*"
          AHEAD=$(git rev-list --count "origin/main..origin/$STAGING_BRANCH")
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" = "0" ]; then
            echo "clear=yes" >> "$GITHUB_OUTPUT"
            echo "staging holds nothing that main does not. Safe to put a drop on it."
          else
            echo "clear=no" >> "$GITHUB_OUTPUT"
            echo "staging has $AHEAD commit(s) that main does not:"
            git log --oneline "origin/main..origin/$STAGING_BRANCH"
          fi

      - name: Nothing to do
        if: steps.peek.outputs.new != 'yes' || steps.staging.outputs.clear == 'no'
        run: |
          if [ "${{ steps.peek.outputs.new }}" != "yes" ]; then
            echo "Up to date with upstream at \`${{ steps.peek.outputs.short }}\`." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Upstream has \`${{ steps.peek.outputs.short }}\` waiting, but **staging is not clear**:"
              echo "it holds ${{ steps.staging.outputs.ahead }} commit(s) that \`main\` does not."
              echo
              echo 'Most likely a drop is sitting there waiting for approval, or one'
              echo 'stalled. Approve or reject it, merge staging into main, or reset'
              echo 'staging with `git push origin main:staging --force`, and the next'
              echo 'run will pick this drop up.'
              echo
              echo 'Green on purpose — whatever is on staging was reported once already,'
              echo 'and repeating it every hour would be noise.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything below runs only when there is a drop to take and somewhere
      # clear to put it.

      - uses: actions/setup-node@v4
        if: steps.staging.outputs.clear == 'yes'
        with:
          node-version: '22'

      - name: Clone upstream
        if: steps.staging.outputs.clear == 'yes'
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
          REPO: ${{ steps.peek.outputs.repo }}
        run: |
          if [ -n "$UPSTREAM_TOKEN" ]; then
            AUTH_REPO="https://x-access-token:$UPSTREAM_TOKEN@github.com/${REPO#https://github.com/}"
          else
            AUTH_REPO="$REPO"
          fi

          git clone --quiet "$AUTH_REPO" "$RUNNER_TEMP/upstream" 2>/dev/null \
            || { echo "clone of $REPO failed" >&2; exit 1; }

          # A clone writes its URL into .git/config, credential and all.
          # Strip it: apply-upstream-drop.mjs only reads history and files,
          # and a token has no business sitting in a working copy.
          git -C "$RUNNER_TEMP/upstream" remote set-url origin "$REPO"

          git -C "$RUNNER_TEMP/upstream" log -1 --oneline \
            "origin/${{ steps.peek.outputs.ubranch }}"

      # Copies upstream in, re-extracts the API routes, re-applies the local
      # fixes, scans for live credentials, diffs the prices and flag defaults,
      # and lists every staff surface with whether it is gated. Writes the
      # report that becomes the pull request body. Allowed to fail: a blocking
      # finding should still produce something to read.
      - name: Apply the drop
        id: apply
        if: steps.staging.outputs.clear == 'yes'
        continue-on-error: true
        run: |
          node tools/apply-upstream-drop.mjs \
            --upstream "$RUNNER_TEMP/upstream" \
            --report "$RUNNER_TEMP/report.md" \
            --status "$RUNNER_TEMP/status.json"

      - name: Read the status
        id: status
        if: steps.staging.outputs.clear == 'yes'
        run: |
          S="$RUNNER_TEMP/status.json"
          if [ ! -f "$S" ]; then
            echo 'The apply step produced no status file, so it died before it could' >&2
            echo 'report. Read its log above — this is not a drop finding.' >&2
            exit 1
          fi
          cat "$S"
          {
            echo "status=$(jq -r '.status' "$S")"
            echo "blockers=$(jq -r '.blockers' "$S")"
            # Through jq and trimmed, so a subject containing quotes or
            # backticks cannot break the shell or the later gh invocation.
            echo "subject=$(jq -r '.subject // ""' "$S" | tr -d '\n' | cut -c1-120)"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.staging.outputs.clear == 'yes'
        run: npm ci || npm install

      - name: Type-check
        id: tsc
        if: steps.staging.outputs.clear == 'yes'
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build
        id: build
        if: steps.staging.outputs.clear == 'yes'
        continue-on-error: true
        run: npx vite build

      - name: Install Playwright
        if: steps.staging.outputs.clear == 'yes' && steps.build.outcome == 'success'
        run: |
          # Not a dependency of the app — only the gate suite needs it, and
          # pinning it here keeps it out of everyone's install.
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      # Drives a real browser through upstream's own staff login for each role
      # and checks the surface stays shut. The password is generated here and
      # thrown away, so this needs no repository secret.
      - name: Verify the staff gates
        id: gates
        if: steps.staging.outputs.clear == 'yes' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          PW=$(node -e 'console.log(require("crypto").randomBytes(16).toString("hex"))')
          NODE_ENV=production ADMIN_PASSWORD="$PW" PORT=3111 npx tsx server.ts \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://localhost:3111/; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://localhost:3111/ || {
            echo "the server never came up:"; cat "$RUNNER_TEMP/server.log"; exit 1; }
          ADMIN_PASSWORD="$PW" node tools/verify-staff-gates.cjs \
            | tee "$RUNNER_TEMP/gates.txt"

      - name: Assemble the pull request body
        if: steps.staging.outputs.clear == 'yes'
        run: |
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo '## Checks'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| type-check | ${{ steps.tsc.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo "| staff gate suite | ${{ steps.gates.outcome }} |"
            echo
            if [ -f "$RUNNER_TEMP/gates.txt" ]; then
              echo '<details><summary>Gate suite output</summary>'
              echo
              echo '```'
              cat "$RUNNER_TEMP/gates.txt"
              echo '```'
              echo
              echo '</details>'
              echo
            fi
            echo '---'
            echo
            echo 'Opened by `.github/workflows/upstream-drop.yml`. The drop is on'
            echo '`staging` and deployed there. If the checks and the staging smoke test'
            echo 'passed, the run is now waiting for someone to approve the deployment to'
            echo 'production — approve or reject it from the Actions run, the email, or'
            echo 'the GitHub mobile app. If something stopped it, no approval was asked'
            echo 'for and the report above says why.'
            echo
            echo 'To undo an approved drop, press Revert. Vercel redeploys from `main`,'
            echo 'so the revert is the rollback.'
            echo
            echo 'The "for a person to read" section is worth reading either way: the'
            echo 'checks cannot tell whether a commit message is true, or whether a price'
            echo 'change is the one that was asked for.'
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"

      # Recorded before anything is promoted, so the production smoke test can
      # tell a landed deploy from Vercel not having finished.
      - name: Note what is live now
        id: before
        if: steps.staging.outputs.clear == 'yes'
        run: |
          HASH=$(curl -fsS --max-time 25 "$LIVE_URL/" \
            | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 \
            | sed 's|assets/index-||; s|\.js$||') || HASH=''
          echo "bundle=$HASH" >> "$GITHUB_OUTPUT"
          echo "live bundle before this drop: ${HASH:-unknown}"

      - name: Put the drop on staging, and open the promotion PR
        id: push
        if: steps.staging.outputs.clear == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ steps.peek.outputs.short }}
          SUBJECT: ${{ steps.status.outputs.subject }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # dist/ and node_modules/ are in .gitignore, so the build and the
          # no-save playwright install cannot end up on the branch.
          git add -A
          if git diff --cached --quiet; then
            echo 'Upstream moved but nothing changed in this repo.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git commit -q -m "Upstream CRM drop $SHORT" \
            -m "$SUBJECT" \
            -m "Applied by .github/workflows/upstream-drop.yml. See the pull request for what still needs reading."

          # A fast-forward: this is main plus one commit, and staging was
          # checked to hold nothing main does not.
          git push -q origin "HEAD:refs/heads/$STAGING_BRANCH"
          echo "pushed=yes" >> "$GITHUB_OUTPUT"

          # One promotion PR at a time, staging into main. If one is already
          # open, refresh its body rather than failing.
          gh pr create --base main --head "$STAGING_BRANCH" \
            --title "Upstream CRM drop $SHORT: $SUBJECT" \
            --body-file "$RUNNER_TEMP/pr-body.md" --draft \
          || gh pr edit "$STAGING_BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"

          gh pr view "$STAGING_BRANCH" --json url -q .url >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the staging deployment
        id: staging_deploy
        if: steps.push.outputs.pushed == 'yes'
        run: |
          URL="https://$VERCEL_PROJECT-git-$STAGING_BRANCH-$VERCEL_SCOPE.vercel.app"
          echo "expecting $URL"
          FOUND=''
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL/" || echo 000)
            # 404 is Vercel saying there is no such deployment yet, 000 is no
            # answer. Anything else means it exists — including 401 and 302,
            # which are Deployment Protection, and which the smoke test
            # reports properly.
            if [ "$CODE" != "404" ] && [ "$CODE" != "000" ]; then
              echo "staging answering with $CODE after about $(( i * 20 ))s"
              FOUND="$URL"
              break
            fi
            sleep 20
          done
          echo "url=$FOUND" >> "$GITHUB_OUTPUT"
          if [ -z "$FOUND" ]; then
            echo "No staging deployment at $URL within about ten minutes, so the drop"
            echo "has only been seen on a runner. No approval will be requested."
          fi

      - name: Smoke-test staging
        id: staging_smoke
        if: steps.staging_deploy.outputs.url != ''
        continue-on-error: true
        env:
          URL: ${{ steps.staging_deploy.outputs.url }}
          # Optional. Preview deployments are protected by default, and a
          # protected deployment cannot be tested from here — see the notes at
          # the top of this file. Without it the drop waits on staging rather
          # than being offered for approval, which is the safe way round.
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set +e
          node tools/smoke-live.cjs "$URL" > "$RUNNER_TEMP/staging-smoke.txt" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/staging-smoke.txt"
          {
            echo '## Staging'
            echo
            echo "<$URL>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/staging-smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Is this worth asking anyone to approve?
        id: verdict
        if: steps.push.outputs.pushed == 'yes'
        env:
          BLOCKERS: ${{ steps.status.outputs.blockers }}
          TSC: ${{ steps.tsc.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GATES: ${{ steps.gates.outcome }}
          STAGING_URL: ${{ steps.staging_deploy.outputs.url }}
          STAGING_SMOKE: ${{ steps.staging_smoke.outcome }}
        run: |
          NEEDS=0
          if [ "$BLOCKERS" != "0" ]; then NEEDS=1; fi
          if [ "$TSC" != "success" ]; then NEEDS=1; fi
          if [ "$BUILD" != "success" ]; then NEEDS=1; fi
          if [ "$GATES" != "success" ]; then NEEDS=1; fi
          if [ -z "$STAGING_URL" ]; then
            NEEDS=1
            echo "No staging deployment, so nothing was verified outside CI."
          elif [ "$STAGING_SMOKE" != "success" ]; then
            NEEDS=1
            echo "The staging deployment did not pass its smoke test."
          fi

          if [ "$NEEDS" = "0" ]; then
            echo "promotable=yes" >> "$GITHUB_OUTPUT"
            echo "Everything passed. An approval will be requested for production."
          else
            echo "promotable=no" >> "$GITHUB_OUTPUT"
            echo "Not asking for approval — there is nothing worth approving yet."
          fi

      # Ends the run in failure when a drop is stuck, which is how the
      # notification happens: GitHub does not email about a successful
      # scheduled run. It fires once per drop, because while the drop sits on
      # staging the "is staging clear?" step ends later runs quietly.
      #
      # A promotable drop does NOT fail here — it does not need to. The
      # environment approval request is its own notification.
      - name: Say if this needs a person
        if: steps.push.outputs.pushed == 'yes' && steps.verdict.outputs.promotable == 'no'
        env:
          SHORT: ${{ steps.peek.outputs.short }}
          BLOCKERS: ${{ steps.status.outputs.blockers }}
          TSC: ${{ steps.tsc.outcome }}
          BUILD: ${{ steps.build.outcome }}
          GATES: ${{ steps.gates.outcome }}
          STAGING_URL: ${{ steps.staging_deploy.outputs.url }}
          STAGING_SMOKE: ${{ steps.staging_smoke.outcome }}
        run: |
          echo "Drop $SHORT is ON STAGING and was not offered for approval:"
          echo "  blocking findings: $BLOCKERS"
          echo "  type-check: $TSC   build: $BUILD   gate suite: $GATES"
          if [ -z "$STAGING_URL" ]; then
            echo "  staging deployment: none found"
          else
            echo "  staging smoke test: $STAGING_SMOKE"
            echo "  staging URL: $STAGING_URL"
          fi
          echo
          echo "Production is untouched. Open the staging URL to see the drop running,"
          echo "and the pull request for what stopped it."
          echo
          echo "Until staging is dealt with — merged, or reset with"
          echo "'git push origin main:staging --force' — no further drop will be taken."
          exit 1

  # -------------------------------------------------------------- promote --
  # Guarded by the `production` environment. GitHub holds this job and asks
  # the environment's reviewers to approve before any of it runs, so the
  # pause happens with the drop already live on staging and tested there.
  promote:
    needs: stage
    if: needs.stage.outputs.promotable == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://portabox-instant-quote-dun.vercel.app

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge staging into main
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT: ${{ needs.stage.outputs.short }}
        run: |
          echo "Approved. Promoting drop $SHORT from staging to main."
          gh pr ready "$STAGING_BRANCH" || true

          # A merge commit, not a squash. Squashing would rewrite the drop as
          # a new commit on main, leaving staging permanently ahead of main
          # and blocking every future drop at the "is staging clear?" step.
          # Mergeability is computed asynchronously, so the first attempt can
          # lose a race with GitHub.
          for i in 1 2 3 4 5; do
            if gh pr merge "$STAGING_BRANCH" --merge; then
              echo "Merged. Vercel deploys production from main."
              exit 0
            fi
            echo "merge attempt $i did not take; waiting"
            sleep 15
          done

          echo "Approved, but the merge would not go through." >&2
          echo "Branch protection, or the repo setting that lets Actions open and" >&2
          echo "merge pull requests, is the usual reason. The pull request is open" >&2
          echo "and complete, so it can be merged by hand." >&2
          exit 1

      - name: Wait for production, then smoke-test it
        id: smoke
        continue-on-error: true
        env:
          BEFORE: ${{ needs.stage.outputs.before }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          echo "waiting for Vercel to publish a new bundle (was ${BEFORE:-unknown})"
          LANDED=no
          for i in $(seq 1 20); do
            NOW=$(curl -fsS --max-time 20 "$LIVE_URL/" \
              | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 \
              | sed 's|assets/index-||; s|\.js$||') || NOW=''
            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "deploy landed after ~$(( i * 20 ))s: $BEFORE -> $NOW"
              LANDED=yes
              break
            fi
            sleep 20
          done
          if [ "$LANDED" != "yes" ]; then
            echo "No new bundle within about seven minutes. Smoke-testing anyway so"
            echo "the summary says what production is actually serving."
          fi

          # Run first, print second, keep the exit status. Piping into tee
          # would hand this step tee's status instead — always zero — so a
          # failing smoke test would read as a pass.
          set +e
          if [ -n "$BEFORE" ]; then
            node tools/smoke-live.cjs "$LIVE_URL" --expect-bundle-change "$BEFORE" \
              > "$RUNNER_TEMP/smoke.txt" 2>&1
          else
            node tools/smoke-live.cjs "$LIVE_URL" > "$RUNNER_TEMP/smoke.txt" 2>&1
          fi
          RC=$?
          set -e

          cat "$RUNNER_TEMP/smoke.txt"
          {
            echo '## Production after the promotion'
            echo
            echo '```'
            cat "$RUNNER_TEMP/smoke.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: Report
        env:
          SHORT: ${{ needs.stage.outputs.short }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          if [ "$SMOKE" = "success" ]; then
            echo "Drop $SHORT was approved and is live. Production is serving the"
            echo "quote flow with the staff gate in place."
            exit 0
          fi

          echo "Drop $SHORT WENT LIVE and the production smoke test did not pass."
          echo
          echo "It passed on staging, so this is the production deploy itself. The"
          echo "smoke output above says which check failed. To roll back, open the"
          echo "merged pull request and press Revert."
          exit 1
